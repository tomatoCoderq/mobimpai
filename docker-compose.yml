# Local dev stack (Mac). No Caddy, no TLS, no domain.
# - Frontend served via its built-in nginx on host port 3000 (SPA + /api proxy).
# - Backend also exposed on host port 8000 for direct debugging / curl.
#
# Usage:
#   docker compose up -d --build
#   open http://localhost:3000
#
# For the VM / prod stack, use docker-compose.prod.yml instead.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mobimpai-backend
    environment:
      MODEL_PATH: /app/sidewalk_model.onnx
      TILE_SERVER_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      OSRM_BASE_URL: https://router.project-osrm.org
      MAPILLARY_TOKEN: ${MAPILLARY_TOKEN}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    image: mobimpai-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
