# Production stack without domain — accessible by IP:port, no TLS.
# Frontend on host port 3000, backend on host port 8000.
#
# Usage on the server:
#   docker compose -f docker-compose.ip.yml up -d --build
#   # Then open http://<your-ip>:3000

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mobimpai-backend
    environment:
      MODEL_PATH: /app/sidewalk_model.onnx
      TILE_SERVER_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      OSRM_BASE_URL: https://router.project-osrm.org
      MAPILLARY_TOKEN: ${MAPILLARY_TOKEN}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    image: mobimpai-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
